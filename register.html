<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>สมัครสมาชิก · โรงพยาบาลหันคา</title>
<meta name="theme-color" content="#0A1317">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">
  <div class="promo-banner" id="promo-banner"></div>
  <header class="topbar">
    <a class="brand" href="index.html">
      <span class="brand-mark"><img src="icons/logo.png" alt="โลโก้โรงพยาบาลหันคา"></span>
      <span class="brand-text">โรงพยาบาลหันคา<small>ระบบบริหารงานทรัพยากรบุคคล</small></span>
    </a>
    <nav class="nav-links"><a href="index.html">แดชบอร์ด</a></nav>
    <div class="user-chip"></div>
  </header>

  <main class="container">
    <div class="breadcrumb">
      <a href="index.html">แดชบอร์ด</a><span class="sep">/</span><span class="current">สมัครสมาชิก</span>
    </div>
    <div class="card auth-card">
      <h1 style="font-size:20px">สมัครสมาชิก</h1>
      <p style="color:var(--steel); font-size:13px; margin-top:-6px; margin-bottom:20px">
        สำหรับเจ้าหน้าที่ฝ่ายบุคคลและบุคลากรที่ได้รับสิทธิ์เข้าถึงระบบ
      </p>
      <div class="msg error" id="reg-error"></div>
      <div class="msg success" id="reg-success"></div>
      <form id="register-form">
        <div class="field">
          <label for="displayName">ชื่อ-นามสกุล</label>
          <input type="text" id="displayName" required>
        </div>
        <div class="field">
          <label for="username">ชื่อผู้ใช้</label>
          <input type="text" id="username" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">รหัสผ่าน</label>
          <input type="password" id="password" autocomplete="new-password" minlength="8" required>
        </div>
        <div class="field">
          <label for="password2">ยืนยันรหัสผ่าน</label>
          <input type="password" id="password2" autocomplete="new-password" minlength="8" required>
        </div>
        <button class="btn btn-buy btn-block" type="submit" id="reg-btn">สมัครสมาชิก</button>
      </form>
      <p class="helper-link">มีบัญชีอยู่แล้ว? <a href="login.html">เข้าสู่ระบบ</a></p>
    </div>
  </main>
  <div class="footer-note">© โรงพยาบาลหันคา — ระบบบริหารงานทรัพยากรบุคคล</div>
</div>

<script src="js/config.js"></script>
<script src="js/mockdata.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
  document.getElementById("register-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errBox = document.getElementById("reg-error");
    const okBox = document.getElementById("reg-success");
    errBox.classList.remove("show"); okBox.classList.remove("show");
    const btn = document.getElementById("reg-btn");

    const password = document.getElementById("password").value;
    const password2 = document.getElementById("password2").value;
    if (password !== password2) {
      errBox.textContent = "รหัสผ่านยืนยันไม่ตรงกัน";
      errBox.classList.add("show");
      return;
    }
    btn.disabled = true; btn.textContent = "กำลังสมัครสมาชิก...";
    try {
      const username = document.getElementById("username").value.trim();
      const displayName = document.getElementById("displayName").value.trim();
      await HRHK_API.register(username, password, displayName);
      okBox.textContent = "สมัครสมาชิกสำเร็จ กำลังนำไปหน้าเข้าสู่ระบบ...";
      okBox.classList.add("show");
      setTimeout(() => (location.href = "login.html"), 1200);
    } catch (err) {
      errBox.textContent = err.message || "สมัครสมาชิกไม่สำเร็จ";
      errBox.classList.add("show");
      btn.disabled = false; btn.textContent = "สมัครสมาชิก";
    }
  });
</script>
<script src="js/pwa.js"></script>
</body>
</html>
